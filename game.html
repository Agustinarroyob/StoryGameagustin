<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play the Soccer Game</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <nav class="site-nav bg-light border-bottom py-2">
        <div class="container d-flex flex-wrap align-items-center gap-3">
            <a class="navbar-brand" href="index.html">Soccer Game</a>
            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link active" href="game.html">Play</a>
            <a class="nav-link" href="about.html">About Me</a>
        </div>
    </nav>

    <main class="container py-4">
        <div class="row g-3">
            <div class="col-md-8">
                <header>
                    <h1 id="scene-title" class="heading"></h1>
                    <h2 id="character-name"></h2>
                </header>
                <p id="scene-text" class="border rounded p-3"></p>
                <section id="choices-container" aria-label="Game choices"></section>
            </div>
            <div class="col-md-4">
                <aside class="border rounded p-3 bg-light">
                    <p>Time remaining:</p>
                    <p><span id="time-display" class="badge text-bg-success">4 minutes</span></p>
                    <p>Inventory:</p>
                    <p><span id="inventory-display" class="badge text-bg-secondary">Nothing found yet</span></p>
                    <p id="message-display" class="mb-0"></p>
                </aside>
            </div>
        </div>
    </main>
</body>
</html>
