<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missing Soccer Gear</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="site-nav bg-light border-bottom py-2">
        <div class="container d-flex flex-wrap align-items-center gap-3">
            <a class="navbar-brand" href="index.html">Soccer Game</a>
            <a class="nav-link active" href="index.html">Home</a>
            <a class="nav-link" href="game.html">Play</a>
            <a class="nav-link" href="about.html">About Me</a>
        </div>
    </nav>

    <main class="container py-4">
        <h1 class="heading">The Missing Soccer Gear</h1>
        <div class="row g-3 align-items-center mt-1">
            <div class="col-md-6">
                <img class="home-image img-fluid" src="images.jpg" alt="Soccer cleats and shin guards">
            </div>
            <div class="col-md-6">
                <section class="border rounded p-3">
                    <h2 class="h4">What's the game about?</h2>
                    <p>I have a soccer game soon, but I can't find my cleats or shin guards. Help me look before it's time to leave!</p>
                    <form id="home-form">
                        <label class="form-label" for="first-place">Where should I look first?</label>
                        <select class="form-select mb-3" id="first-place" required>
                            <option value="" selected disabled>Choose a place</option>
                            <option>Living room</option>
                            <option>Bathroom</option>
                            <option>Garage</option>
                            <option>Kitchen</option>
                        </select>
                        <button class="btn btn-success" type="submit">Pick this place</button>
                        <p id="home-message" class="mt-3 mb-0" aria-live="polite"></p>
                    </form>
                    <a class="btn btn-success mt-3" href="game.html">Play the game</a>
                </section>
            </div>
        </div>
    </main>
    <script>
        document.getElementById("home-form").addEventListener("submit", (event) => {
            event.preventDefault();
            const place = document.getElementById("first-place").value;
            document.getElementById("home-message").textContent = `You picked the ${place}. Start the game to look there!`;
        });
    </script>
</body>
</html>
