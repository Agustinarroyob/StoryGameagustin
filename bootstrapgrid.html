<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Color Chart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .box {
      border: 1px solid #333333;
      height: 90px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    .red { background-color: red; color: white; }
    .orange { background-color: orange; color: black; }
    .yellow { background-color: yellow; color: black; }
    .green { background-color: green; color: white; }
    .blue { background-color: blue; color: white; }
    .purple { background-color: purple; color: white; }
    .pink { background-color: pink; color: black; }
    .black { background-color: black; color: white; }
    .gray { background-color: gray; color: white; }
  </style>
</head>
<body>

  <div class="container mt-4">
    <h3 class="text-center mb-3">Colors</h3>

    <!-- Row 1 -->
    <div class="row g-2">
      <div class="col-4">
        <div class="box red">Red</div>
      </div>
      <div class="col-4">
        <div class="box orange">Orange</div>
      </div>
      <div class="col-4">
        <div class="box yellow">Yellow</div>
      </div>
    </div>

    <!-- Row 2 -->
    <div class="row g-2 mt-2">
      <div class="col-4">
        <div class="box green">Green</div>
      </div>
      <div class="col-4">
        <div class="box blue">Blue</div>
      </div>
      <div class="col-4">
        <div class="box purple">Purple</div>
      </div>
    </div>

    <!-- Row 3 -->
    <div class="row g-2 mt-2">
      <div class="col-4">
        <div class="box pink">Pink</div>
      </div>
      <div class="col-4">
        <div class="box black">Black</div>
      </div>
      <div class="col-4">
        <div class="box gray">Gray</div>
      </div>
    </div>

  </div>

</body>
</html>
